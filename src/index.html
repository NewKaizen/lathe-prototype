<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Gêmeo Digital · Frota Industrial</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon-light.svg" />
        <link rel="apple-touch-icon" href="/favicon.ico" />
        <style>
            .boot-screen {
                min-height: 100vh;
                display: grid;
                place-content: center;
                justify-items: center;
                gap: 14px;
                color: #525252;
                font:
                    500 14px system-ui,
                    sans-serif;
            }
            .boot-spinner {
                width: 30px;
                height: 30px;
                border: 3px solid #e0e0e0;
                border-top-color: #0f62fe;
                border-radius: 50%;
                animation: boot-spin 0.8s linear infinite;
            }
            @keyframes boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-spinner {
                    animation-duration: 2.5s;
                }
            }
        </style>
    </head>
    <body>
        <app-root>
            <div class="boot-screen" role="status" aria-live="polite">
                <span class="boot-spinner" aria-hidden="true"></span>
                <span>Carregando o sistema</span>
            </div>
        </app-root>
    </body>
</html>
