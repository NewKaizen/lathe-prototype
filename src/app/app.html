@if (!auth.user()) {
<app-login-screen (login)="onLogin($event)" />
<app-toast-container />
} @else {
<app-fleet-selector
    [lathes]="fleet()"
    [userName]="auth.user()!.name"
    [page]="fleetPage()"
    [selectedLathe]="selectedLathe()"
    [latheHistory]="latheHistory()"
    [tick]="tick()"
    [machineTab]="view()"
    (machineTabChange)="view.set($event)"
    (select)="onSelectLathe($event)"
    (deselect)="onBackToFleet()"
    (logout)="onLogout()"
    (openHelp)="isHelpOpen.set(true)"
    (pageChange)="fleetPage.set($event)"
/>
<app-toast-container />
} @if (auth.user()) {
<!-- Fase 2.3: ícone de Ajuda — substitui "Central de Comandos"/"Dicas" como itens de nav.
     No desktop mora no rodapé de cada sidebar (junto de Configurações/Sair, perto do usuário);
     esta versão fixa no topo é só o equivalente mobile, onde a sidebar fica escondida. -->
<button
    (click)="isHelpOpen.set(true)"
    aria-label="Ajuda"
    title="Ajuda"
    class="md:hidden fixed top-4 right-4 z-40 w-9 h-9 rounded-full border border-border bg-card hover:bg-secondary text-foreground flex items-center justify-center transition-colors"
>
    <app-icon name="help" [size]="18" />
</button>
} @if (isHelpOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 modal-overlay-scrim" aria-hidden="true" (click)="isHelpOpen.set(false)"></div>
    <div
        class="relative tile max-w-2xl w-full max-h-[85vh] overflow-y-auto custom-scrollbar p-6"
        role="dialog"
        aria-modal="true"
        aria-label="Ajuda"
    >
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-[18px] font-semibold text-foreground">Ajuda</h2>
            <button
                (click)="isHelpOpen.set(false)"
                aria-label="Fechar"
                class="p-1.5 text-muted-foreground hover:text-foreground transition-colors"
            >
                <app-icon name="x" [size]="18" />
            </button>
        </div>
        <app-fleet-commands-view />
    </div>
</div>
}
