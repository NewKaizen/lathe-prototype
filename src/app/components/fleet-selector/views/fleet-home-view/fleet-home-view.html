<div class="space-y-8">
    <app-fleet-overview-view
        [overview]="overview()"
        [counts]="counts()"
        [totalCount]="totalCount()"
        (select)="select.emit($event)"
    />

    <div>
        <h3 class="text-[13px] font-semibold text-muted-foreground uppercase tracking-wider mb-3">Acesso Rápido</h3>
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
            <button
                (click)="navigate.emit('fleet')"
                class="tile px-4 py-3 flex items-center gap-3 hover:bg-secondary/40 transition-colors text-left"
            >
                <app-icon name="layout-grid" [size]="18" class="text-primary shrink-0" />
                <span class="text-[13px] font-semibold text-foreground">Ver Frota</span>
            </button>
            <button
                (click)="navigate.emit('alerts')"
                class="tile px-4 py-3 flex items-center gap-3 hover:bg-secondary/40 transition-colors text-left"
            >
                <app-icon name="alert-triangle" [size]="18" class="text-[var(--status-red)] shrink-0" />
                <span class="text-[13px] font-semibold text-foreground">Ver Alertas</span>
                @if (alertCount() > 0) {
                <span
                    class="ml-auto inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-[var(--status-red)] px-1 text-[10px] font-bold text-white"
                >
                    {{ alertCount() > 9 ? '9+' : alertCount() }}
                </span>
                }
            </button>
            <button
                (click)="navigate.emit('maintenance')"
                class="tile px-4 py-3 flex items-center gap-3 hover:bg-secondary/40 transition-colors text-left"
            >
                <app-icon name="calendar" [size]="18" class="text-primary shrink-0" />
                <span class="text-[13px] font-semibold text-foreground">Ver Manutenções</span>
            </button>
        </div>
    </div>
</div>
