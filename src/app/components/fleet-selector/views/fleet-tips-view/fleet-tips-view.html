<div class="space-y-5">
    @for (cat of categories; track cat.title) {
    <div class="tile p-5">
        <div class="flex items-center gap-2.5 mb-4">
            <div class="w-8 h-8 flex items-center justify-center shrink-0" [style.background]="cat.accent + '1a'">
                <app-icon [name]="cat.icon" [size]="16" [style.color]="cat.accent" />
            </div>
            <h3 class="text-[15px] font-semibold text-foreground">{{ cat.title }}</h3>
        </div>
        <ul class="space-y-3">
            @for (tip of cat.tips; track tip) {
            <li class="flex items-start gap-2.5">
                <span class="w-1.5 h-1.5 mt-2 rounded-full shrink-0" [style.background]="cat.accent"></span>
                <p class="text-[13px] text-muted-foreground leading-relaxed">{{ tip }}</p>
            </li>
            }
        </ul>
    </div>
    }
</div>
