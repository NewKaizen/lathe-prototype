<div>
    <h3 class="text-[13px] font-semibold text-muted-foreground uppercase tracking-wider mb-3">Acesso Rápido</h3>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="tile px-4 py-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-[var(--status-green)]/10 flex items-center justify-center shrink-0">
                <app-icon name="trending-up" [size]="20" class="text-[var(--status-green)]" />
            </div>
            <div>
                <p class="text-[10px] text-muted-foreground leading-none mb-1">Eficiência Média</p>
                <p class="text-[17px] font-bold text-foreground tabular-nums">{{ overview().avgEfficiency }}%</p>
            </div>
        </div>
        <div class="tile px-4 py-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-[var(--status-red)]/10 flex items-center justify-center shrink-0">
                <app-icon name="thermometer" [size]="20" class="text-[var(--status-red)]" />
            </div>
            <div>
                <p class="text-[10px] text-muted-foreground leading-none mb-1">Temp. Média</p>
                <p class="text-[17px] font-bold text-foreground tabular-nums">{{ overview().avgTemp }}°C</p>
            </div>
        </div>
        <div class="tile px-4 py-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-primary/10 flex items-center justify-center shrink-0">
                <app-icon name="clock" [size]="20" class="text-primary" />
            </div>
            <div>
                <p class="text-[10px] text-muted-foreground leading-none mb-1">Horas Totais</p>
                <p class="text-[17px] font-bold text-foreground tabular-nums">{{ overview().totalHours }}</p>
            </div>
        </div>
        <div class="tile px-4 py-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-[var(--status-green)]/10 flex items-center justify-center shrink-0">
                <app-icon name="activity" [size]="20" class="text-[var(--status-green)]" />
            </div>
            <div>
                <p class="text-[10px] text-muted-foreground leading-none mb-1">Em Operação</p>
                <p class="text-[17px] font-bold text-foreground tabular-nums">
                    {{ counts().operational }}/{{ totalCount() }}
                </p>
            </div>
        </div>
        @for (s of statusOrder; track s) {
        <div class="tile px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full" [class]="STATUS_META[s].dot"></div>
                <span class="text-[12px] text-muted-foreground">{{ STATUS_META[s].label }}</span>
            </div>
            <span class="text-[22px] font-bold text-foreground tabular-nums">{{ counts()[s] }}</span>
        </div>
        }
    </div>
</div>
