<div class="relative w-full">
    <div class="relative">
        <app-icon
            name="search"
            [size]="18"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"
        />
        <input
            type="text"
            ngCombobox
            #combobox="ngCombobox"
            [value]="query()"
            (valueChange)="onInput($event)"
            [(expanded)]="expanded"
            placeholder="Pesquisar páginas, ações, tornos... (use : , &gt; ou &lt;)"
            aria-label="Busca interna"
            class="w-full h-14 pl-12 pr-[4.75rem] bg-card border border-border focus:outline-2 focus:outline-[var(--focus)] outline-offset-[-2px] text-[15px] text-foreground placeholder:text-muted-foreground"
        />
        <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
            @if (hasQuery()) {
            <button
                type="button"
                (click)="clear()"
                aria-label="Limpar busca"
                class="p-2 text-muted-foreground hover:text-foreground transition-colors"
            >
                <app-icon name="x" [size]="14" />
            </button>
            }
            <button
                type="button"
                (click)="openReference.emit()"
                title="Ver todos os comandos"
                aria-label="Ver todos os comandos"
                class="px-2.5 py-1.5 text-[11px] font-mono font-semibold text-muted-foreground border border-border/70 hover:text-foreground hover:border-border transition-colors"
            >
                ?
            </button>
        </div>
    </div>

    <ng-template ngComboboxPopup [combobox]="combobox">
        <div
            class="absolute z-30 mt-1.5 w-full tile max-h-[22rem] overflow-y-auto custom-scrollbar"
            ngComboboxWidget
            ngListbox
            #listbox="ngListbox"
            aria-label="Resultados da busca"
            focusMode="activedescendant"
            selectionMode="explicit"
            [wrap]="true"
            [activeDescendant]="listbox.activeDescendant()"
            [value]="[]"
            (valueChange)="onSelection($event)"
        >
            @if (results().length === 0) {
            <div role="status" class="px-4 py-6 text-center">
                <p class="text-[13px] text-muted-foreground">
                    Nada encontrado. Tente outro termo ou use <span class="font-mono">&gt;</span>,
                    <span class="font-mono">:</span> ou <span class="font-mono">&lt;</span>.
                </p>
            </div>
            } @else { @for (r of results(); track r.key) {
            <button
                type="button"
                ngOption
                #option="ngOption"
                [value]="r.key"
                [label]="r.title"
                class="w-full flex items-center gap-3 px-4 py-3 text-left border-b border-border/40 last:border-b-0 transition-colors"
                [class.bg-secondary]="option.active()"
            >
                <app-icon [name]="r.icon" [size]="16" [class]="r.iconClass + ' shrink-0'" />
                <div class="flex-1 min-w-0">
                    <p class="text-[13px] font-semibold text-foreground truncate">{{ r.title }}</p>
                    <p class="text-[11px] text-muted-foreground truncate">{{ r.subtitle }}</p>
                </div>
                <span class="text-overline text-muted-foreground/70 shrink-0">{{ kindLabel(r.kind) }}</span>
            </button>
            } }
        </div>
    </ng-template>
</div>
