<div class="fixed inset-0 z-[60] overflow-auto bg-background/95 p-6 backdrop-blur-sm" role="status" aria-live="polite">
    <div class="mx-auto max-w-7xl animate-pulse">
        <div class="mb-8 flex items-center gap-3">
            <span
                class="grid h-10 w-10 place-items-center rounded-full border-2 border-primary/30 border-t-primary animate-spin"
                aria-hidden="true"
            ></span>
            <div class="space-y-2">
                <p class="text-sm font-semibold text-foreground">Carregando conteúdo</p>
                <div class="h-2 w-40 rounded bg-secondary"></div>
            </div>
        </div>
        <div class="mb-6 h-8 w-56 rounded bg-secondary"></div>
        <div class="mb-6 grid grid-cols-1 gap-4 xl:grid-cols-2">
            <div class="tile h-64 space-y-5 p-6">
                <div class="h-4 w-40 rounded bg-secondary"></div>
                <div class="h-8 w-24 rounded bg-secondary"></div>
                <div class="h-28 rounded bg-secondary/70"></div>
            </div>
            <div class="tile h-64 flex items-center gap-8 p-6">
                <div class="h-36 w-36 shrink-0 rounded-full border-[18px] border-secondary"></div>
                <div class="flex-1 space-y-4">
                    <div class="h-3 rounded bg-secondary"></div>
                    <div class="h-3 rounded bg-secondary"></div>
                    <div class="h-3 rounded bg-secondary"></div>
                    <div class="h-3 rounded bg-secondary"></div>
                </div>
            </div>
        </div>
        <div class="mb-6 grid grid-cols-2 gap-3 lg:grid-cols-4">
            @for (card of [1, 2, 3, 4]; track card) {
            <div class="tile h-24 space-y-3 p-4">
                <div class="h-3 w-2/3 rounded bg-secondary"></div>
                <div class="h-6 w-1/3 rounded bg-secondary"></div>
            </div>
            }
        </div>
        <div class="space-y-3">
            @for (row of [1, 2, 3, 4]; track row) {
            <div class="tile h-16 p-4"><div class="h-3 w-3/4 rounded bg-secondary"></div></div>
            }
        </div>
    </div>
</div>
